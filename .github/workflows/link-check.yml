name: Link check

# Weekly check that every external link in the app and docs still resolves:
# library entries, framework sources, the about and privacy pages. Runs on
# GitHub's network. A failed run emails the repo owner.
on:
  schedule:
    - cron: '17 21 * * 0'   # Sunday 21:17 UTC (Monday morning AEST)
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '*.md'
      - 'index.html'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Excluded links, and why:
      # - The OAIC media release cited in home-algorithm-said-no (30 Sep
      #   2026) sits behind a bot challenge since November 2026, so every
      #   automated request gets 403. It was confirmed live through search
      #   on 25 Nov 2026. Check it by hand in a browser each quarter, with
      #   the other "where to report" links.
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,429
            --root-dir ${{ github.workspace }}/public
            --exclude '\$'
            --exclude '<'
            --exclude '/docs/\.\.\.'
            --exclude 'plausible\.io/js/'
            --exclude 'schema\.org'
            --exclude '(imsglobal|adlnet|w3|sitemaps)\.org'
            --exclude '^mailto:'
            --exclude 'oaic\.gov\.au/news/media-centre/new-resources-on-transparency-for-use-of-ai-and-automated-decision-making'
            'src/**/*.js' 'src/**/*.jsx' 'src/**/*.md'
            README.md CONTRIBUTING.md ARCHITECTURE.md index.html
