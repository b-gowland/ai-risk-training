name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed per ref so a batch of PRs (e.g. a stacked contributor series) does
  # not cancel its own siblings. Real deploys all run on refs/heads/main and
  # still serialise — the property this block exists for. Mirrors the
  # Jul 23 2026 ai-risk-kb fix (b45b9ae).
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Route audit — cross-surface integrity
        run: node scripts/route-audit.mjs
      - name: Scenario audit — every registered scenario
        run: node scripts/scenario-audit.mjs
      - name: SCORM adapter check
        run: npm run test:scorm
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploys only on push to main (or manual dispatch) — never from a PR,
  # so unreviewed branches cannot reach production.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
