name: Check and deploy

# Checks run on every pull request and push. A push to main also deploys to
# Cloudflare Pages (project ai-risk-app), which serves app.airiskpractice.org
# since the move off GitHub Pages on 17 Nov 2026.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# the "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID. Until
# they exist the deploy job says so and stops without failing the run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed per ref so a batch of PRs does not cancel its own siblings. Real
  # deploys all run on refs/heads/main and still serialise.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Route audit — cross-surface integrity
        run: node scripts/route-audit.mjs
      - name: Scenario audit — every registered scenario
        run: node scripts/scenario-audit.mjs
      - name: SCORM adapter check
        run: npm run test:scorm
      - run: npm run build

  # Deploys only on push to main (or manual dispatch), never from a PR, so
  # unreviewed branches cannot reach production. It rebuilds rather than
  # passing an artifact between jobs; the build takes seconds.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.airiskpractice.org/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      deployed: ${{ steps.publish.outputs.deployed }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. Add both as repository secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: Publish to Cloudflare Pages
        id: publish
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name=ai-risk-app --branch=main --commit-dirty=true
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # After a deploy, announce the published URLs to IndexNow (Bing and
  # others) so changes reach search and AI answers without waiting for a
  # re-crawl. Never fails the workflow: a missed ping only means waiting.
  indexnow:
    if: github.event_name != 'pull_request' && needs.deploy.outputs.deployed == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Announce URLs
        run: node scripts/indexnow.mjs
